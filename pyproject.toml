[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheetah-synth"
version = "0.1.0"
description = "Synthetic performance-marketing journey data generator calibrated against CHEETAH's real Oct 2026 reports"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cheetah-synth = "cheetah_synth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
