services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cheetah
      POSTGRES_USER: cheetah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheetah"]
      interval: 5s
      retries: 15
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in .env}
    volumes:
      - neo4jdata:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
  api:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://cheetah:${POSTGRES_PASSWORD}@postgres:5432/cheetah
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://cheetah:${POSTGRES_PASSWORD}@postgres:5432/cheetah
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
  neo4jdata:
